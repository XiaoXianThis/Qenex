name: CI

on:
  push:
    branches: [fusion, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (Desktop Tauri shell only)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Bridge unit tests
        run: bun run test:bridge

      - name: CORS + M9 guards
        run: bun test apps/bridge/test/cors.test.ts && bun run --filter @qenex/bridge test:m9

      - name: Build web frontend
        run: bun run build:web

      - name: Build server package smoke
        run: bun run build

      - name: Verify Desktop wiring
        run: bun run verify:desktop
